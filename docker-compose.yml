services:
  depot:
    build: .
    restart: unless-stopped
    volumes:
      # Read-only: DEPOT only ever reads scans from here. All writes (moves,
      # renames, new folders) go through WebDAV so Nextcloud's file cache
      # stays in sync.
      - /mnt/<pool>/nextcloud/data/<user>/files:/nextcloud-data:ro
      - depot-scratch:/scratch
    env_file:
      - .env

volumes:
  depot-scratch:
